<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOEIC 600 衝刺本</title>
<meta name="description" content="以多益 600 分為目標的英文學習 App：單字間隔複習、Part 1–7 題庫、文法重點、模擬測驗與錯題本，可離線使用。">
<meta name="theme-color" content="#2448b8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="多益600">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#f3f5f9}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: answer-sheet notebook — sidebar of OMR bubbles on desktop, sticky strip on phone; cobalt form ink + graphite pencil + highlighter */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#1c212b; --muted:#5a6375; --line:#dce1ea;
  --form:#2448b8; --form-soft:#e7ecfb; --pencil:#272b33; --hl:#ffec8a;
  --ok:#1d7a50; --ok-soft:#e2f3e9; --bad:#b42318; --bad-soft:#fbe8e6;
  --heat0:#e6eaf1; --heat1:#c6d2f4; --heat2:#8fa5ea; --heat3:#5372d8; --heat4:#2448b8;
  --b-orange:#e0893a; --b-brown:#8b5a3a; --b-green:#3d9a5d; --b-blue:#3a6dd0; --b-gold:#c9a227;
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Noto Serif TC",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#191d25; --ink:#e5e8ee; --muted:#99a2b2; --line:#2a303c;
  --form:#8ea4ff; --form-soft:#222b47; --pencil:#e5e8ee; --hl:#5c4f14;
  --ok:#5fd09a; --ok-soft:#173026; --bad:#ff8a7a; --bad-soft:#3a1e1b;
  --heat0:#1f242e; --heat1:#29345e; --heat2:#3a4d93; --heat3:#5a74d4; --heat4:#8ea4ff;
  --b-orange:#e99a50; --b-brown:#a8775a; --b-green:#55b274; --b-blue:#5a8be6; --b-gold:#d8b444;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#191d25; --ink:#e5e8ee; --muted:#99a2b2; --line:#2a303c;
  --form:#8ea4ff; --form-soft:#222b47; --pencil:#e5e8ee; --hl:#5c4f14;
  --ok:#5fd09a; --ok-soft:#173026; --bad:#ff8a7a; --bad-soft:#3a1e1b;
  --heat0:#1f242e; --heat1:#29345e; --heat2:#3a4d93; --heat3:#5a74d4; --heat4:#8ea4ff;
  --b-orange:#e99a50; --b-brown:#a8775a; --b-green:#55b274; --b-blue:#5a8be6; --b-gold:#d8b444;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--form);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:26px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--form);font-weight:600}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%);padding-inline:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 56px;display:grid;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand .mark{display:flex;gap:3px}
.brand .mark i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--form)}
.brand .mark i.f{background:var(--pencil);border-color:var(--pencil)}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-family:var(--f-mono)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.err{background:var(--bad)}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;padding-block:8px;padding-inline:16px;margin-inline:-16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500;font-size:14.5px}
.nav a i{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;flex:none;opacity:.7}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a.on{color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.nav a.on i{background:var(--pencil);border-color:var(--pencil);opacity:1}
.nav .badge{font-family:var(--f-mono);font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 6px}
main{min-width:0;padding-block:22px}
@media (min-width:900px){
  .app{grid-template-columns:196px minmax(0,1fr);column-gap:36px}
  .top{grid-column:1/-1;border-bottom:1px solid var(--line)}
  .nav{flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;border:0;margin:0;padding:22px 0 0;overflow:visible;background:transparent}
}

.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.view-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.view-h p{color:var(--muted);margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:500;font-size:14.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--form)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--form);border-color:var(--form);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ai{border-style:dashed;color:var(--form)}
.btn.danger{color:var(--bad)}
body:not(.has-ai) .ai-only{display:none!important}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--form)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.pill.on{border-color:var(--form);color:var(--form);background:var(--form-soft)}
.pill small{font-family:var(--f-mono);margin-left:4px;opacity:.8}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:860px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.hero h1{font-size:clamp(28px,4.4vw,40px);font-weight:700;letter-spacing:-.02em;margin-top:8px}
.hero h1 .big{font-family:var(--f-mono);font-weight:600}
.hero .sub{color:var(--muted);margin-top:10px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
input[type=date],input[type=number],input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.6}

.scale{position:relative;padding:34px 0 22px}
.scale-track{position:relative;height:12px;border-radius:6px;overflow:hidden;background:var(--heat0)}
.scale-track span{position:absolute;top:0;bottom:0;opacity:.85}
.scale-mark{position:absolute;top:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.scale-mark i{width:2px;height:34px;background:var(--ink)}
.scale-mark em{font-style:normal;font-size:12px;font-family:var(--f-mono);white-space:nowrap;position:absolute}
.scale-mark.target em{top:38px;color:var(--muted)}
.scale-mark.est i{background:var(--form);width:3px}
.scale-mark.est em{top:-20px;color:var(--form);font-weight:600}
.scale-ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:34px}
.scale-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.scale-legend span{display:inline-flex;align-items:center;gap:5px}
.scale-legend i{width:10px;height:10px;border-radius:2px}
.score-split{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.score-split div{display:flex;flex-direction:column}
.score-split b{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.1}
.score-split span{font-size:12px;color:var(--muted)}

/* tasks */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .bub{width:24px;height:24px;font-size:11px}
.task.done .bub{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.task h4{margin:0;font-size:15px;font-weight:600}
.task p{font-size:13px;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--heat0);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--form);border-radius:3px}

/* heatmap */
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:var(--heat0)}
.heat i.l1{background:var(--heat1)} .heat i.l2{background:var(--heat2)} .heat i.l3{background:var(--heat3)} .heat i.l4{background:var(--heat4)}
.heat i.today{box-shadow:0 0 0 1.5px var(--ink)}
.heat-legend{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.heat-legend i{width:11px;height:11px;border-radius:2px;display:inline-block}

/* plan */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
.plan li:first-child{border-top:0}
.plan .wk{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.plan li.now .wk{color:var(--form);font-weight:600}
.plan li.now b{background:linear-gradient(transparent 58%,var(--hl) 58%)}
.plan li.past{opacity:.55}
.plan p{color:var(--muted);font-size:13px}

/* bubbles & questions */
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--form);color:var(--form);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;transition:background .12s}
.q{padding:4px 0}
.q + .q{border-top:1px solid var(--line);padding-top:16px;margin-top:12px}
.q-stem{display:flex;gap:10px;font-size:16.5px;line-height:1.6;margin-bottom:10px}
.q-num{font-family:var(--f-mono);color:var(--muted);font-size:14px;padding-top:3px;flex:none}
.q-text{min-width:0;font-family:var(--f-read)}
.blank{display:inline-block;min-width:76px;border-bottom:2px solid var(--ink);margin-inline:3px;text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:3px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-read);font-size:16px}
.opt:hover:not(:disabled){background:var(--form-soft)}
.opt:disabled{cursor:default}
.opt.sel .bub{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.opt.right{background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt-t{min-width:0}
.exp{margin-top:12px;border-radius:8px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);font-size:14.5px}
.exp > b{display:block;margin-bottom:4px}
.exp.ok > b{color:var(--ok)} .exp.bad > b{color:var(--bad)}
.ai-row{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.ai-out{margin-top:10px;padding:12px 14px;border-left:3px solid var(--form);background:var(--form-soft);border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.75;white-space:normal;overflow-wrap:anywhere}

.sess{display:flex;flex-direction:column;gap:14px}
.sess-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sess-title{display:flex;flex-direction:column}
.sess-count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.sess-tools{display:flex;gap:8px;align-items:center}
.timer{font-family:var(--f-mono);font-size:15px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.prog{height:4px;background:var(--heat0);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--form);transition:width .25s}
.grp{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.grp-label{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.qs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.sess-nav{display:flex;gap:8px;justify-content:flex-end}
@media (min-width:1020px){
  .grp.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .grp.split .grp-label,.grp.split .audio{grid-column:1/-1}
  .grp.split .passage{position:sticky;top:16px;max-height:calc(100vh - 40px);overflow:auto}
  .grp.split .sess-nav{grid-column:2}
}
.passage{font-family:var(--f-read);font-size:16px;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0;overflow-wrap:anywhere}
.passage h4{font-family:var(--f-body);font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600}
.passage p + p{margin-top:10px}
.passage .memo-h{font-family:var(--f-mono);font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;line-height:1.6}
.passage .sms{display:flex;flex-direction:column;gap:8px}
.passage .sms p{margin:0;padding:8px 12px;background:var(--bg);border-radius:8px}
.passage .sms small{font-family:var(--f-mono);color:var(--muted);font-size:12px;display:block}
.audio{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.audio .wave{display:flex;gap:3px;align-items:center;height:22px}
.audio .wave i{width:3px;height:6px;background:var(--form);border-radius:2px;opacity:.5}
.audio.playing .wave i{animation:wv 1s ease-in-out infinite}
.audio.playing .wave i:nth-child(2){animation-delay:.15s}.audio.playing .wave i:nth-child(3){animation-delay:.3s}.audio.playing .wave i:nth-child(4){animation-delay:.45s}.audio.playing .wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{50%{height:20px;opacity:1}}
@media (prefers-reduced-motion:reduce){.audio.playing .wave i{animation:none;height:14px;opacity:1}}
.trans{width:100%;font-family:var(--f-read);font-size:15px}
.trans summary{cursor:pointer;color:var(--form);font-family:var(--f-body);font-size:14px}
.trans p{margin-top:6px}

/* summary */
.sum-big{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1}
.wrong-list{display:flex;flex-direction:column;gap:12px}
.wrong-item{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg)}
.wrong-item .ans{font-size:14px;margin-top:6px}
.wrong-item .ans .bad{color:var(--bad)} .wrong-item .ans .ok{color:var(--ok)}

/* flashcards */
.flash{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 24px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.flash .fw{font-family:var(--f-display);font-size:clamp(34px,7vw,52px);font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.flash .fpos{font-family:var(--f-mono);color:var(--muted);font-size:14px}
.flash .back{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:560px;border-top:1px dashed var(--line);padding-top:16px;margin-top:6px}
.flash .zh{font-size:22px;font-weight:700}
.flash .ex{font-family:var(--f-read);font-size:17px}
.flash .ex b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:600}
.flash .exzh{color:var(--muted);font-size:14px}
.flash .boxes{position:absolute;top:14px;right:16px;display:flex;gap:3px}
.boxes i{width:8px;height:8px;border-radius:50%;border:1.2px solid var(--form)}
.boxes i.f{background:var(--form)}
.fbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fbtns.one{grid-template-columns:minmax(0,1fr)}
.fbtns .btn{padding:12px 8px;flex-direction:column;gap:0}
.fbtns .btn small{font-size:11.5px;color:var(--muted);font-weight:400}
.fbtns .btn.primary small{color:var(--surface);opacity:.8}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;color:var(--form);flex:none}
.speak svg{width:16px;height:16px}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* word list */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.w{font-family:var(--f-read);font-weight:600;font-size:15.5px;white-space:nowrap}
td.pos{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}

.stat span{font-size:12.5px;color:var(--muted)}

/* list cards */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}

.li h4{margin:0;font-size:15px;font-weight:600}
.li p{font-size:13px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:4px;background:var(--form-soft);color:var(--form);margin-right:6px}

/* grammar */
details.gram{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0}

details.gram summary::-webkit-details-marker{display:none}
details.gram summary h3{font-size:17px}
details.gram summary p{font-size:13.5px;color:var(--muted);margin-top:3px}
details.gram summary .chev{font-family:var(--f-mono);color:var(--muted);transition:transform .15s}
details.gram[open] summary .chev{transform:rotate(90deg)}
.gram-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.gram-body td u{text-decoration:none;background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:600}
.gram-body td.ex{font-family:var(--f-read)}
.tips{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}

/* apply */
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer}

.scen button span{font-size:12.5px;color:var(--muted)}

.passage table{font-family:var(--f-body);font-size:14px;margin-block:6px}
.wk-row{display:grid;grid-template-columns:108px minmax(0,1fr) 104px;gap:12px;align-items:center;padding-block:6px;font-size:14px}
.wk-bar{position:relative;height:10px;background:var(--heat0);border-radius:5px}
.wk-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--form);border-radius:0 4px 4px 0}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 在 Claude 裡開啟時 window.claude 會在頁面腳本之前就存在；沒有它就是離線獨立版
const STANDALONE = !(window.claude && window.claude.use);
function dstr(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const today = () => dstr(new Date());
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate()+n); return dstr(d); }
function daysBetween(a, b){ return Math.round((parseD(b) - parseD(a)) / 86400000); }
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

{"type": "Part 7 雙篇", "title": "場地廣告＋預約信", "html": "<section class=\"doc\"><span class=\"doc-tag\">文章 1・廣告</span><h4>Sunrise Conference Center — Meeting Rooms for Rent</h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Room</th><th>Capacity</th><th>Price per day</th></tr></thead><tbody><tr><td>Maple Room</td><td>20</td><td>$250</td></tr><tr><td>Oak Room</td><td>50</td><td>$450</td></tr><tr><td>Grand Hall</td><td>200</td><td>$1,200</td></tr></tbody></table></div>\n<p>All rentals include free Wi-Fi and a projector. Catering is available for an additional fee. Organizations that book a room for three or more days receive a 10% discount.</p></section>\n<section class=\"doc\"><span class=\"doc-tag\">文章 2・電子郵件</span><div class=\"memo-h\">To: Sunrise Conference Center<br>From: Tina Park<br>Subject: Room reservation</div>\n<p>Hello,</p><p>I would like to reserve a room for our company's sales training from June 3 to June 5. We expect about 40 participants, and we will need lunch each day for everyone. Could you send me a menu and a price list? Also, is there parking available nearby?</p>\n<p>Thank you,<br>Tina Park<br>Hanover Medical Supplies</p></section>", "qs": [{"q": "What is included in all room rentals?", "o": ["Lunch", "A projector", "Parking", "A microphone"], "a": 1, "e": "廣告：All rentals include free Wi-Fi and a projector。餐點要另外付費。"}, {"q": "Which room will Ms. Park most likely reserve?", "o": ["The Maple Room", "The Oak Room", "The Grand Hall", "The lobby"], "a": 1, "e": "跨文章題：信中說約 40 人，廣告表格中 Maple 只容納 20 人，Oak 容納 50 人 → Oak Room。"}, {"q": "What is suggested about Ms. Park's booking?", "o": ["It will receive a discount.", "It is for a product launch.", "It will be held in July.", "It does not need catering."], "a": 0, "e": "跨文章題：6/3 到 6/5 共三天，廣告說訂三天以上打九折 → 會有折扣。"}, {"q": "What does Ms. Park ask for?", "o": ["A floor plan", "A parking permit", "A refund", "A menu and a price list"], "a": 3, "e": "Could you send me a menu and a price list?"}, {"q": "What kind of business does Ms. Park work for?", "o": ["A hotel", "A travel agency", "A medical supply company", "A software firm"], "a": 2, "e": "署名 Hanover Medical Supplies → 醫療用品公司。"}]},
{"type": "Part 7 雙篇", "title": "飯店評論＋經理回覆", "html": "<section class=\"doc\"><span class=\"doc-tag\">文章 1・線上評論</span><h4>★★★☆☆ Reviewed by Alan Ford, August 12</h4>\n<p>I stayed at the Harborview Hotel for three nights on a business trip. My room was clean, and the view of the harbor was beautiful. However, the Wi-Fi in my room was very slow, which made it difficult to work in the evenings. Also, breakfast ended at 9:00 A.M., which was too early for me on the weekend. The front desk staff were friendly and helpful.</p></section>\n<section class=\"doc\"><span class=\"doc-tag\">文章 2・回覆</span><h4>Response from Grace Lin, General Manager, August 14</h4>\n<p>Dear Mr. Ford,</p><p>Thank you for staying with us and for your helpful comments. I'm glad you enjoyed the view and our staff's service. We are aware of the Internet problem and are pleased to inform you that a new high-speed network will be installed by the end of this month. In addition, starting in September, breakfast will be served until 10:30 A.M. on Saturdays and Sundays.</p><p>We hope to welcome you back soon.</p></section>", "qs": [{"q": "Why did Mr. Ford stay at the hotel?", "o": ["For a vacation", "For a business trip", "For a wedding", "For a training course"], "a": 1, "e": "on a business trip。"}, {"q": "What did Mr. Ford like about the hotel?", "o": ["The breakfast", "The Wi-Fi", "The harbor view", "The parking"], "a": 2, "e": "the view of the harbor was beautiful；Wi-Fi 和早餐是他抱怨的地方。"}, {"q": "What problem did Mr. Ford mention?", "o": ["His room was dirty.", "The Internet was slow.", "The staff were rude.", "The room was noisy."], "a": 1, "e": "the Wi-Fi in my room was very slow → Internet was slow（換句話說）。"}, {"q": "What will change in September?", "o": ["Room prices", "The hotel manager", "Checkout time", "Weekend breakfast hours"], "a": 3, "e": "starting in September, breakfast will be served until 10:30 A.M. on Saturdays and Sundays。"}, {"q": "What does Ms. Lin indicate about the hotel's network?", "o": [ {"type": "Part 7 雙篇", "title": "發票＋客戶來信", "html": "<section class=\"doc\"><span class=\"doc-tag\">文章 1・發票</span><h4>Bright Office Supplies — Invoice #7741</h4>\n<p class=\"memo-h\" style=\"border:0;padding:0;margin:0 0 6px\">Date: May 2<br>Customer: Lakeside Dental Clinic</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Total</th></tr></thead><tbody><tr><td>Printer paper (box)</td><td>10</td><td>$25</td><td>$250</td></tr><tr><td>Black ink cartridge</td><td>6</td><td>$40</td><td>$240</td></tr><tr><td>Desk chair</td><td>2</td><td>$150</td><td>$300</td></tr></tbody></table></div>\n<p>Delivery: Free (orders over $500)<br><b>Total due: $790</b>　Payment due by May 31</p></section>\n<section class=\"doc\"><span class=\"doc-tag\">文章 2・電子郵件</span><div class=\"memo-h\">To: Bright Office Supplies, Customer Service<br>From: Rachel Moore, Office Manager, Lakeside Dental Clinic<br>Date: May 6<br>Subject: Invoice #7741</div>\n<p>Hello,</p><p>We received our order yesterday, but there seems to be a problem. We were charged for six ink cartridges, but only four were in the box. Could you either send the missing items or correct the invoice?</p><p>Also, one of the chairs has a small scratch, but we have decided to keep it.</p><p>Thank you,<br>Rachel Moore</p></section>", "qs": [{"q": "What is indicated on the invoice?", "o": ["Payment is due by May 6.", "The chairs cost $300 each.", "Delivery was free.", "The order was placed by phone."], "a": 2, "e": "Delivery: Free (orders over $500)。椅子單價是 $150，$300 是兩張的總價。"}, {"q": "When did Lakeside Dental Clinic most likely receive the order?", "o": ["May 2", "May 5", "May 6", "May 31"], "a": 1, "e": "跨文章題：信件日期 May 6，信中說 received our order yesterday → May 5。"}, {"q": "Which item was delivered in the wrong quantity?", "o": ["Printer paper", "Ink cartridges", "Desk chairs", "Envelopes"], "a": 1, "e": "charged for six ink cartridges, but only four were in the box。"}, {"q": "By how much was the clinic overcharged?", "o": ["$40", "$80", "$150", "$250"], "a": 1, "e": "跨文章計算：少了 2 個墨水匣 × 單價 $40 = $80。"}, {"q": "What does Ms. Moore say about the chairs?", "o": ["Both chairs must be replaced.", "They were not delivered.", "They are the wrong color.", "One has minor damage, but she will keep it."], "a": 3, "e": "one of the chairs has a small scratch, but we have decided to keep it。small scratch = minor damage。"}]},

/* ============ 狀態與雲端同步 ============ */
const LS_KEY = 'toeic600.v1';
function freshState(){ return {v:1, settings:{target:600, examDate:'', startDate:today(), rate:0.9, voiceA:'', voiceB:'', newPerDay:10}, srs:{}, log:{}, mistakes:[], mocks:[], seen:{}, stats:{}, updatedAt:0}; }
function mergeState(o){ const b = freshState(); return {...b, ...o, settings:{...b.settings, ...(o.settings || {})}}; }
function loadLocal(){ try { const raw = localStorage.getItem(LS_KEY); if (raw) return mergeState(JSON.parse(raw)); } catch(e){} return freshState(); }
let S = loadLocal();
let dbRef = null, dbBusy = false, dbDirty = false, saveTimer = null, syncState = 'local';
let inSession = false, AI = null, keyHandler = null;

function save(){
  S.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
  clearTimeout(saveTimer); saveTimer = setTimeout(flushDb, 1500);
  renderHeader();
}
async function flushDb(){
  if (!dbRef) return;
  if (dbBusy){ dbDirty = true; return; }
  dbBusy = true;
  try { await dbRef.set(JSON.parse(JSON.stringify(S))); setSync('ok'); }
  catch(e){ setSync(e && e.code === 'quota_exceeded' ? 'err' : 'err'); }
  dbBusy = false;
  if (dbDirty){ dbDirty = false; flushDb(); }
}
function setSync(s){ syncState = s; renderHeader(); }
async function initCloud(){
  if (!window.claude || !window.claude.use){ setSync('local'); return; }
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user){ setSync('local'); return; }
    const id = await user.id();
    if (!id){ setSync('local'); return; }
    dbRef = db.doc('data/users/' + id + '/progress');
    const snap = await dbRef.get();
    if (snap.exists){
      const remote = snap.data() || {};
      if ((remote.updatedAt || 0) > (S.updatedAt || 0)){
        S = mergeState(JSON.parse(JSON.stringify(remote)));
        try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
        if (!inSession) route();
      } else if ((S.updatedAt || 0) > (remote.updatedAt || 0)) flushDb();
    } else if (S.updatedAt) flushDb();
    setSync('ok');
  } catch(e){ setSync('local'); }
}
async function initAI(){
  if (!window.claude || !window.claude.use) return;
  try { AI = await claude.use('sample'); } catch(e){ AI = null; }
  document.body.classList.toggle('has-ai', !!AI);
  if (AI && !inSession && current === 'apply') route();
}
function aiErrMsg(e){
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed'){
    AI = null; document.body.classList.remove('has-ai');
    return 'AI 功能沒有被允許，已先關閉。重新整理頁面後可以再選擇允許。';
  }
  if (c === 'rate_limited') return '使用太頻繁或已達用量上限，稍後再試。';
  if (c === 'session_expired') return '登入已過期，請重新登入 Claude。';
  if (c === 'refused') return 'AI 無法處理這段內容，換個說法試試。';
  if (c === 'invalid_json') return 'AI 回覆的格式不完整，請再按一次。';
  if (c === 'cancelled') return '';
  return 'AI 暫時沒有回應，請再按一次。';
}

/* ============ 學習紀錄 ============ */
function day(){ const t = today(); if (!S.log[t]) S.log[t] = {w:0, r:0, l:0, lc:0, rd:0, rc:0, ai:0}; return S.log[t]; }
function activity(d){ return d ? (d.w + d.r + d.l + d.rd + (d.ai || 0) * 3 + (d.dict || 0)) : 0; }
function streak(){ let n = 0, t = today(); if (!activity(S.log[t])) t = addDays(t, -1); while (activity(S.log[t])){ n++; t = addDays(t, -1); } return n; }
function logAnswer(sec, ok){ const d = day(); if (sec === 'L'){ d.l++; if (ok) d.lc++; } else if (sec === 'R'){ d.rd++; if (ok) d.rc++; } }
function round5(x){ return Math.round(x / 5) * 5; }
function secScore(pct, k){ return Math.max(5, Math.min(495, round5(5 + 490 * Math.pow(pct, k)))); }
function estimate(){
  let l = 0, lc = 0, rd = 0, rc = 0; const t = today();
  for (let i = 0; i < 14; i++){ const d = S.log[addDays(t, -i)]; if (d){ l += d.l; lc += d.lc; rd += d.rd; rc += d.rc; } }
  if (l < 10 || rd < 10) return {ready:false, needL:Math.max(0, 10 - l), needR:Math.max(0, 10 - rd)};
  const L1 = secScore(lc / l, 0.95), R1 = secScore(rc / rd, 1.05);
  return {ready:true, L:L1, R:R1, total:L1 + R1, lp:lc / l, rp:rc / rd};
}
function addMistake(q){
  const i = S.mistakes.findIndex(m => m.k === q.key);
  const prev = i >= 0 ? S.mistakes.splice(i, 1)[0] : null;
  const m = {k:q.key, t:Date.now(), c:(prev ? prev.c : 0) + 1};
  if (q.key.startsWith('ai:')) m.q = {stem:q.stemText, opts:q.opts, a:q.a, exp:q.exp};
  S.mistakes.unshift(m);
  if (S.mistakes.length > 300) S.mistakes.length = 300;
}
function removeMistake(key){ S.mistakes = S.mistakes.filter(m => m.k !== key); }

/* ============ 單字 SRS（萊特納盒） ============ */
const INTERVALS = [0, 1, 2, 4, 7, 15, 30];
function grade(id, g){
  const isNew = !S.srs[id];
  const c = S.srs[id] || {b:0, d:today(), n:0, l:0};
  if (g === 0){ c.b = 0; c.l++; c.d = today(); }
  else if (g === 1){ c.b = Math.max(1, c.b); c.d = addDays(today(), 1); }
  else { c.b = Math.min(6, c.b + 1); c.d = addDays(today(), INTERVALS[c.b]); }
  c.n++; S.srs[id] = c;
  const d = day(); if (isNew) d.w++; else d.r++;
  save();
}
function dueWords(){ const t = today(); return WORDS.filter(w => S.srs[w.id] && S.srs[w.id].d <= t).map(w => w.id); }
function learnedCount(){ return Object.keys(S.srs).length; }
function masteredCount(){ return Object.values(S.srs).filter(c => c.b >= 4).length; }
function boxesHtml(id){ const b = S.srs[id] ? S.srs[id].b : -1; let h = '<span class="boxes" title="熟練度">'; for (let i = 1; i <= 6; i++) h += `<i class="${b >= i ? 'f' : ''}"></i>`; return h + '</span>'; }

/* ============ 語音 ============ */
let voices = [];
const hasTTS = 'speechSynthesis' in window;
function loadVoices(){ try { voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); } catch(e){ voices = []; } }
if (hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (current === 'settings' && !inSession) route(); }; }
function pickVoice(which){
  const name = which === 'B' ? S.settings.voiceB : S.settings.voiceA;
  let v = voices.find(x => x.name === name);
  if (v) return v;
  const us = voices.filter(x => /en[-_]US/i.test(x.lang));
  const pool = us.length ? us : voices;
  if (!pool.length) return null;
  if (which === 'B') return pool.find(x => /(^|\W)(male|david|guy|daniel|alex|fred|mark|james|christopher|eric|andrew|brian)/i.test(x.name) && !/female/i.test(x.name)) || pool[1] || pool[0];
  return pool.find(x => /(female|zira|samantha|aria|jenny|susan|karen|emma|ava|michelle|libby)/i.test(x.name)) || pool[0];
}
let speakToken = 0;
function speakSeq(items, onDone){
  if (!hasTTS){ toast('這個瀏覽器不支援語音播放'); onDone && onDone(); return; }
  try { speechSynthesis.cancel(); } catch(e){}
  const tok = ++speakToken; let i = 0;
  const vA = pickVoice('A'), vB = pickVoice('B');
  const next = () => {
    if (tok !== speakToken) return;
    if (i >= items.length){ onDone && onDone(); return; }
    const it = items[i++];
    const u = new SpeechSynthesisUtterance(it.t);
    const v = it.v === 'B' ? vB : vA;
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate = it.rate || S.settings.rate;
    if (it.v === 'B' && vA === vB) u.pitch = 0.75;
    u.onend = () => setTimeout(next, it.gap ?? 350);
    u.onerror = () => setTimeout(next, 100);
    speechSynthesis.speak(u);
  };
  next();
}
function speak(text, v){ speakSeq([{t:text, v:v || 'A'}]); }
function stopSpeak(){ speakToken++; if (hasTTS){ try { speechSynthesis.cancel(); } catch(e){} } }

function scaleBar(est, target){
  const pos = v => ((v - 10) / 980 * 100).toFixed(2);
  const bands = [['b-orange',10,220,'橘 10–215'],['b-brown',220,470,'棕 220–465'],['b-green',470,730,'綠 470–725'],['b-blue',730,860,'藍 730–855'],['b-gold',860,990,'金 860–990']];
  return `<div class="scale"><div class="scale-track">${bands.map(b => `<span style="left:${pos(b[1])}%;width:${(pos(b[2]) - pos(b[1])).toFixed(2)}%;background:var(--${b[0]})"></span>`).join('')}</div>
  <div class="scale-mark target" style="left:${pos(target)}%"><i></i><em>目標 ${target}</em></div>
  ${est ? `<div class="scale-mark est" style="left:${pos(est)}%"><i></i><em>預估 ${est}</em></div>` : ''}
  <div class="scale-ticks"><span>10</span><span>495</span><span>990</span></div></div>
  <div class="scale-legend">${bands.map(b => `<span><i style="background:var(--${b[0]})"></i>${b[3]}</span>`).join('')}</div>`;
}

/* ============ 弱點分析 ============ */
const PARTS = [['P1','Part 1 照片'],['P2','Part 2 應答'],['P3','Part 3 對話'],['P4','Part 4 獨白'],['P5','Part 5 填空'],['P6','Part 6 段落'],['P7','Part 7 閱讀']];
function catsOf(key){
  const p = key.split(':'), out = [];
  if (p[0] === 'p1') out.push('P1');
  else if (p[0] === 'p2') out.push('P2');
  else if (p[0] === 'lc'){ const set = LC[+p[1]]; if (set) out.push(set.type === 'talk' ? 'P4' : 'P3'); }
  else if (p[0] === 'p5'){ out.push('P5'); const q = P5[+p[1]]; if (q) out.push('T:' + q.t); }
  else if (p[0] === 'rc'){ const set = RC[+p[1]]; if (set) out.push(/6/.test(set.type) ? 'P6' : 'P7'); }
  else if (p[0] === 'ai') out.push('P5');
  return out;
}
function bumpStats(key, ok){
  if (!S.stats) S.stats = {};
  catsOf(key).forEach(c => { const v = (S.stats[c] || [0, 0]).slice(); v[1]++; if (ok) v[0]++; S.stats[c] = v; });
}
function weaknessHtml(){
  const st = S.stats || {};
  const total = PARTS.reduce((n, [k]) => n + (st[k] ? st[k][1] : 0), 0);
  if (total < 10) return `<p class="muted" style="font-size:14px">答滿 10 題後，這裡會列出每個 Part 的答對率，並挑出最需要加強的文法。目前已作答 <b class="num">${total}</b> 題。</p>`;
  const rows = PARTS.map(([k, name]) => {
    const v = st[k]; const n = v ? v[1] : 0; const pct = n ? Math.round(v[0] / n * 100) : 0;
    const tag = n >= 5 ? (pct < 60 ? '<span class="wk-tag warn">需加強</span>' : pct >= 75 ? '<span class="wk-tag good">穩定</span>' : '') : '';
    return `<div class="wk-row" title="${name}：答對 ${v ? v[0] : 0} / ${n} 題">
      <span>${name}${tag}</span>
      <div class="wk-bar" role="img" aria-label="${name} 答對率 ${n ? pct + '%' : '尚無資料'}">${n ? `<i style="width:${pct}%"></i>` : ''}<b style="left:60%"></b></div>
      <span class="wk-val">${n ? `<em>${pct}%</em> · ${v[0]}/${n}` : '還沒做過'}</span></div>`;
  }).join('');
  const weak = Object.keys(TAGS).map(t => [t, st['T:' + t]]).filter(x => x[1] && x[1][1] >= 3)
    .map(([t, v]) => [t, v, v[0] / v[1]]).sort((a, b) => a[2] - b[2]).slice(0, 3).filter(x => x[2] < 0.8);
  const weakHtml = weak.length ? `<div class="wk-weak"><b style="font-size:14px">最需要加強的文法</b>${weak.map(([t, v, r]) =>
    `<div class="li"><div><h4>${TAGS[t]}</h4><p>答對 ${v[0]}/${v[1]} 題（${Math.round(r * 100)}%）</p></div><button class="btn sm primary" data-weak="${t}">練這類題</button></div>`).join('')}</div>` : '';
  return rows + weakHtml;
}

/* ============ 單字 ============ */
let vocabTheme = 'office';
function viewVocab(m){
  const due = dueWords().length; const th = THEMES.find(t => t.id === vocabTheme) || THEMES[0];

  <div class="stats">
    <div class="stat"><b>${learnedCount()}</b><span>已學</span></div>
    <div class="stat"><b>${masteredCount()}</b><span>熟練（4 格以上）</span></div>
    <div class="stat"><b>${due}</b><span>今天到期</span></div>
    <div class="stat"><b>${(S.log[today()] || {}).w || 0}</b><span>今天新學</span></div>
  </div>
  <div class="panel">
    <div class="panel-h"><h3>開始練習</h3></div>

    <div class="pills" style="margin-bottom:12px">${THEMES.map(t => { const n = WORDS.filter(w => w.theme === t.id); const k = n.filter(w => S.srs[w.id]).length;
      return `<button class="pill ${t.id === th.id ? 'on' : ''}" data-th="${t.id}">${t.name}<small>${k}/${n.length}</small></button>`; }).join('')}</div>
    <div class="tbl-wrap"><table><thead><tr><th></th><th>單字</th><th>詞性</th><th>中文</th><th>熟練度</th></tr></thead><tbody>
    ${tw.map(w => `<tr><td style="width:40px"><button class="speak" data-say="${esc(w.w)}" aria-label="播放 ${esc(w.w)}">${SPEAK_SVG}</button></td><td class="w">${esc(w.w)}</td><td class="pos">${esc(w.pos)}</td><td>${esc(w.zh)}<div class="muted" style="font-size:12.5px;font-family:var(--f-read)">${esc(w.ex)}</div></td><td>${boxesHtml(w.id)}</td></tr>`).join('')}

  $$('[data-th]', m).forEach(b => b.onclick = () => { vocabTheme = b.dataset.th; viewVocab(m); });

}
function startNew(m, themeId){
  const n = S.settings.newPerDay;
  let pool = WORDS.filter(w => !S.srs[w.id] && (!themeId || w.theme === themeId));
  if (!pool.length && themeId) pool = WORDS.filter(w => !S.srs[w.id]);
  if (!pool.length){ toast('全部單字都學過了，去複習吧！'); return; }
  const ids = pool.slice(0, n).map(w => w.id);
  startCards(m, ids, '學新字' + (themeId ? '：' + THEMES.find(t => t.id === themeId).name : ''));
}
function startCards(m, ids, title){
  if (!ids.length){ toast('目前沒有要複習的字'); return; }
  inSession = true;
  const queue = ids.slice(); const total = ids.length; const res = {0:0, 1:0, 2:0}; const retried = new Set(); let finished = 0;
  function show(){
    if (!queue.length) return done();
    const w = WMAP[queue[0]]; let revealed = false;
    m.innerHTML = `<div class="sess">
      <div class="sess-head"><div class="sess-title"><span class="eyebrow">${esc(title)}</span><span class="sess-count">完成 ${finished} / ${total}</span></div>
      <div class="sess-tools"><button class="btn ghost sm" id="cx">結束</button></div></div>
      <div class="prog"><i style="width:${finished / total * 100}%"></i></div>
      <div class="flash">${boxesHtml(w.id)}
        <div class="row" style="justify-content:center"><div class="fw">${esc(w.w)}</div><button class="speak" id="sw" aria-label="播放單字">${SPEAK_SVG}</button></div>
        <div class="fpos">${esc(w.pos)}</div>
        <div class="back" id="back" hidden>
          <div class="zh">${esc(w.zh)}</div>
          <div class="row" style="justify-content:center"><div class="ex">${highlightWord(w.ex, w.w)}</div><button class="speak" id="se" aria-label="播放例句">${SPEAK_SVG}</button></div>
          <div class="exzh">${esc(w.exZh)}</div>
        </div>
      </div>
      <div class="fbtns one" id="fb"><button class="btn primary" id="rv">顯示答案<small>空白鍵</small></button></div>
    </div>`;
    $('#cx', m).onclick = done;
    $('#sw', m).onclick = () => speak(w.w);
    $('#se', m).onclick = () => speak(w.ex);
    const reveal = () => {
      revealed = true; $('#back', m).hidden = false;
      const fb = $('#fb', m); fb.className = 'fbtns';
      fb.innerHTML = `<button class="btn" data-g="0">不熟<small>再來一次 · 1</small></button><button class="btn" data-g="1">模糊<small>明天 · 2</small></button><button class="btn primary" data-g="2">記得<small>${nextLabel(w.id)} · 3</small></button>`;
      $$('[data-g]', fb).forEach(b => b.onclick = () => rate(+b.dataset.g));
      speak(w.ex);
    };
    const rate = g => {
      grade(w.id, g); res[g]++; queue.shift();
      if (g === 0 && !retried.has(w.id)){ retried.add(w.id); queue.splice(Math.min(queue.length, 3), 0, w.id); } else finished++;
      show();
    };
    $('#rv', m).onclick = reveal;
    keyHandler = e => {
      if (!revealed && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); reveal(); }
      else if (revealed && ['1','2','3'].includes(e.key)) rate(+e.key - 1);
    };
    setTimeout(() => speak(w.w), 150);
  }
  function done(){
    keyHandler = null; inSession = false; stopSpeak();
    m.innerHTML = `<div class="panel stack"><span class="eyebrow">${esc(title)}・完成</span>
      <div class="sum-big">${finished}<span class="muted" style="font-size:20px"> / ${total} 字</span></div>
      <p class="muted">記得 ${res[2]} 次・模糊 ${res[1]} 次・不熟 ${res[0]} 次。不熟的字今天會再出現在複習清單。</p>
      <div class="row"><button class="btn primary" id="bk">回單字頁</button><button class="btn" id="hm">回今日</button></div></div>`;
    $('#bk', m).onclick = () => viewVocab(m);
    $('#hm', m).onclick = () => go('today');
    renderHeader();
  }
  show();
}
function nextLabel(id){ const c = S.srs[id]; const b = Math.min(6, (c ? c.b : 0) + 1); const d = INTERVALS[b]; return d >= 30 ? '一個月後' : d + ' 天後'; }
function highlightWord(ex, w){
  const base = w.split(' ')[0].replace(/[^a-zA-Z-]/g, '');
  const stem = base.length > 4 ? base.slice(0, base.length - (base.endsWith('e') ? 1 : 0)) : base;
  const re = new RegExp('\\b(' + stem.replace(/[-]/g, '\\-') + '[a-z]*)', 'i');
  const parts = ex.split(re);
  if (parts.length < 3) return esc(ex);
  return esc(parts[0]) + '<b>' + esc(parts[1]) + '</b>' + esc(parts.slice(2).join(''));
}
function startVocabQuiz(m){
  let pool = WORDS.filter(w => S.srs[w.id]);
  if (pool.length < 10) pool = WORDS.filter(w => w.theme === vocabTheme).concat(pool);
  const picks = shuffle([...new Map(pool.map(w => [w.id, w])).values()]).slice(0, 10);
  const groups = picks.map((w, i) => {
    const toZh = i % 2 === 0;
    const same = shuffle(WORDS.filter(x => x.id !== w.id && x.theme === w.theme)).slice(0, 3);
    const opts = shuffle([w, ...same]);
    return {label: toZh ? '選出正確的中文意思' : '選出正確的英文單字', vocabId:w.id, qs:[{key:'v:' + w.id, sec:'V',
      stemHtml: toZh ? `<span style="font-family:var(--f-display);font-size:24px;font-weight:700">${esc(w.w)}</span> <span class="muted num" style="font-size:13px">${esc(w.pos)}</span>` : `<span style="font-size:20px;font-weight:700">${esc(w.zh)}</span> <span class="muted num" style="font-size:13px">${esc(w.pos)}</span>`,
      stemText: toZh ? w.w : w.zh, opts: opts.map(o => toZh ? o.zh : o.w), a: opts.indexOf(w), exp: `${w.w}（${w.pos}）${w.zh}。例句：${w.ex}（${w.exZh}）`}]};
  });
  runSession(m, groups, {title:'單字測驗', onAnswer:(q, i, ok) => { if (!ok) grade(q.key.slice(2), 0); }, again: () => startVocabQuiz(m), back: () => viewVocab(m), backLabel:'回單字頁'});
}

function startDictation(m){
  let pool = WORDS.filter(w => S.srs[w.id]);
  if (pool.length < 10) pool = pool.concat(WORDS.filter(w => w.theme === vocabTheme));
  const items = shuffle([...new Map(pool.map(w => [w.id, w])).values()]).slice(0, 10);
  const norm = t => t.toLowerCase().replace(/[’']/g, "'").replace(/[.\s]+$/, '').replace(/\s+/g, ' ').trim();
  const pattern = w => [...w].map((c, k) => /[a-z]/i.test(c) ? (k === 0 ? c : '_') : (c === ' ' ? '　' : c)).join(' ');
  let i = 0, correct = 0; const missed = [];
  inSession = true;
  function show(){
    if (i >= items.length) return done();
    const w = items[i]; let answered = false;
    m.innerHTML = `<div class="sess">
      <div class="sess-head"><div class="sess-title"><span class="eyebrow">聽音拼字</span><span class="sess-count">第 ${i + 1} 題・共 ${items.length} 題</span></div>
      <div class="sess-tools"><button class="btn ghost sm" id="dx">結束</button></div></div>
      <div class="prog"><i style="width:${i / items.length * 100}%"></i></div>
      <div class="flash">
        <p class="muted">聽發音，拼出這個字</p>
        <div class="row" style="justify-content:center"><button class="btn primary" id="dp" type="button">▶ 播放</button><button class="btn" id="ds" type="button">慢速</button></div>
        <div class="num" style="font-size:22px;letter-spacing:.06em" aria-label="提示">${esc(pattern(w.w))}</div>
        <p class="muted">${esc(w.pos)}・${w.w.replace(/[^a-z]/gi, '').length} 個字母</p>
        <form id="df" class="row" style="justify-content:center;width:100%"><input id="di" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="輸入拼字" style="font-family:var(--f-read);font-size:20px;text-align:center;max-width:320px;width:100%"><button class="btn primary" id="dk">檢查</button></form>
        <div id="dr" class="stack" style="align-items:center;gap:6px"></div>
      </div></div>`;
    const inp = $('#di', m);
    $('#dx', m).onclick = done;
    $('#dp', m).onclick = () => { speak(w.w); inp.focus(); };
    $('#ds', m).onclick = () => { speakSeq([{t:w.w, rate:Math.max(0.5, S.settings.rate * 0.6)}]); inp.focus(); };
    $('#df', m).onsubmit = e => {
      e.preventDefault();
      if (answered){ i++; show(); return; }
      if (!inp.value.trim()){ inp.focus(); return; }
      answered = true;
      const ok = norm(inp.value) === norm(w.w);
      if (ok) correct++; else { missed.push(w); if (S.srs[w.id]) grade(w.id, 0); }
      const d = day(); d.dict = (d.dict || 0) + 1; save();
      inp.readOnly = true; $('#dk', m).textContent = i === items.length - 1 ? '看結果' : '下一題';
      $('#dr', m).innerHTML = `<b style="color:var(--${ok ? 'ok' : 'bad'})">${ok ? '拼對了' : '正確拼法：' + esc(w.w)}</b>
        <div><b>${esc(w.zh)}</b></div><div class="ex">${highlightWord(w.ex, w.w)}</div><div class="exzh">${esc(w.exZh)}</div>`;
      $('#dk', m).focus();
    };
    setTimeout(() => { speak(w.w); inp.focus(); }, 200);
  }
  function done(){
    inSession = false; stopSpeak();
    m.innerHTML = `<div class="panel stack"><span class="eyebrow">聽音拼字・完成</span>
      <div class="sum-big">${correct}<span class="muted" style="font-size:20px"> / ${correct + missed.length}</span></div>
      ${missed.length ? `<p class="muted">拼錯的字（已學過的會放回今天的複習）：</p><ul class="tips">${missed.map(w => `<li><b style="font-family:var(--f-read)">${esc(w.w)}</b>　${esc(w.zh)}</li>`).join('')}</ul>` : '<p class="muted">全部拼對了！</p>'}
      <div class="row"><button class="btn primary" id="ag">再練一組</button><button class="btn" id="bk">回單字頁</button></div></div>`;
    $('#ag', m).onclick = () => startDictation(m);
    $('#bk', m).onclick = () => viewVocab(m);
    renderHeader();
  }
  show();
}

/* ============ 題組建構 ============ */
const blankify = s => esc(s).replace('-------', '<span class="blank">　</span>');
function p5Group(i){ const q = P5[i]; return {label:'PART 5・句子填空・' + TAGS[q.t], qs:[{key:'p5:' + i, sec:'R', stemHtml:blankify(q.q), stemText:q.q, opts:q.o, a:q.a, exp:q.e, tag:q.t}]}; }
function p1Group(i){
  const q = P1[i];
  return {label:'PART 1・照片描述', imageHtml:q.svg(), audio:[{t:'Look at the picture.', v:'A', gap:800}, ...q.o.map((o, j) => ({t:L[j] + '. ' + o, v:'B', gap:700}))],
    transcriptHtml:q.o.map((o, j) => `<p>(${L[j]}) ${esc(o)}</p>`).join(''), transcriptText:'[Photo] ' + q.desc + '\n' + q.o.map((o, j) => `(${L[j]}) ${o}`).join('\n'),
    qs:[{key:'p1:' + i, sec:'L', stem:'Look at the picture and mark the best description.', stemText:'（照片）' + q.desc, listText:'Part 1 照片題 ' + (i + 1), opts:q.o, a:q.a, exp:q.e, hideOpts:true}]};
}
function p2Group(i){
  const q = P2[i]; const qv = i % 2 ? 'B' : 'A', rv = i % 2 ? 'A' : 'B';
  return {label:'PART 2・應答問題', audio:[{t:q[0], v:qv, gap:900}, ...q[1].map((o, j) => ({t:L[j] + '. ' + o, v:rv, gap:600}))],
    transcriptHtml:`<p><b>Q：</b>${esc(q[0])}</p>` + q[1].map((o, j) => `<p>(${L[j]}) ${esc(o)}</p>`).join(''), transcriptText:q[0] + '\n' + q[1].map((o, j) => `(${L[j]}) ${o}`).join('\n'),
    qs:[{key:'p2:' + i, sec:'L', stem:'Mark your answer on your answer sheet.', stemText:q[0], opts:q[1], a:q[2], exp:q[3], hideOpts:true}]};
}
function lcGroup(s, only){
  const set = LC[s];
  const audio = set.lines.map(l => ({t:l[1], v: set.type === 'talk' ? set.voice : (l[0] === 'M' ? 'B' : 'A'), gap:450}));
  const transcriptHtml = set.lines.map(l => `<p>${set.type === 'conv' ? `<b>${l[0] === 'M' ? 'M' : 'W'}：</b>` : ''}${esc(l[1])}</p>`).join('');
  const qs = set.qs.map((q, i) => ({key:`lc:${s}:${i}`, sec:'L', stem:q.q, stemText:q.q, opts:q.o, a:q.a, exp:q.e})).filter((_, i) => only == null || i === only);
  return {label:(set.type === 'talk' ? 'PART 4・簡短獨白・' : 'PART 3・簡短對話・') + set.title, audio, transcriptHtml, transcriptText:set.lines.map(l => l[0] + ': ' + l[1]).join('\n'), qs};
}
function rcGroup(s, only){
  const set = RC[s];
  const qs = set.qs.map((q, i) => ({key:`rc:${s}:${i}`, sec:'R', stem:q.q, stemText:q.q, opts:q.o, a:q.a, exp:q.e})).filter((_, i) => only == null || i === only);
  return {label:set.type.toUpperCase() + '・' + set.title, passageHtml:set.html, passageText:stripTags(set.html), qs};
}
function groupForKey(key, inline){
  const p = key.split(':');
  if (p[0] === 'p5') return P5[+p[1]] ? p5Group(+p[1]) : null;
  if (p[0] === 'p1') return P1[+p[1]] ? p1Group(+p[1]) : null;
  if (p[0] === 'p2') return P2[+p[1]] ? p2Group(+p[1]) : null;
  if (p[0] === 'lc') return LC[+p[1]] ? lcGroup(+p[1], +p[2]) : null;
  if (p[0] === 'rc') return RC[+p[1]] ? rcGroup(+p[1], +p[2]) : null;
  if (p[0] === 'ai' && inline) return {label:'AI 出題・PART 5', qs:[{key, sec:'R', stemHtml:blankify(inline.stem), stemText:inline.stem, opts:inline.opts, a:inline.a, exp:inline.exp}]};
  return null;
}
function pickUnseen(keys, n){ return shuffle(keys).sort((a, b) => (S.seen[a] || 0) - (S.seen[b] || 0)).slice(0, n); }

function qCard(q, num){

function revealCard(el, q, chosen, g){

async function askTeacher(q, chosen, g, out, btn){
  if (!AI){ toast('AI 功能目前無法使用'); return; }
  out.hidden = false; out.textContent = 'AI 老師思考中…'; btn.disabled = true;
  const ctxText = g && (g.transcriptText || g.passageText);
  const prompt = `你是台灣的多益（TOEIC）英文老師，學生目標 600 分。請用繁體中文（台灣用語）講解下面這題，簡潔好懂：
1.【正解】為什麼選 (${L[q.a]})
2.【陷阱】${chosen != null && chosen !== q.a ? `學生選了 (${L[chosen]})，說明為什麼不對` : '其他選項為什麼不對'}
3.【觀念】這題考什麼，給一個考場上能快速判斷的技巧
4.【例句】再給 1 個同觀念的英文例句和中文翻譯
全部 220 字以內，不要用表格。
${ctxText ? `\n【${g.transcriptText ? '聽力文字稿' : '文章'}】\n${ctxText.slice(0, 2500)}\n` : ''}
【題目】${q.stemText || q.stem}
${q.opts.map((o, i) => `(${L[i]}) ${o}`).join('\n')}`;
  try { await AI(prompt, {modelTier:'quick', onText:({text}) => { out.innerHTML = md(text); }}); }
  catch(e){ out.innerHTML = (e && e.text ? md(e.text) : '') + `<p class="muted">${esc(aiErrMsg(e))}</p>`; }
  btn.disabled = false;
}
function runSession(m, groups, opt = {}){
  if (!groups.length){ toast('沒有可練習的題目'); return; }
  inSession = true;
  const feedback = opt.feedback !== false;
  const picks = groups.map(g => g.qs.map(() => null));
  const totalQ = groups.reduce((n, g) => n + g.qs.length, 0);
  let gi = 0, timerId = null, ended = false;
  const endAt = opt.timed ? Date.now() + opt.timed * 60000 : 0;
  m.innerHTML = `<div class="sess">
    <div class="sess-head"><div class="sess-title"><span class="eyebrow">${esc(opt.title || '練習')}</span><span class="sess-count" id="sc"></span></div>
    <div class="sess-tools">${opt.timed ? '<span class="timer" id="tm"></span>' : ''}<button class="btn ghost sm" id="sx">結束</button></div></div>
    <div class="prog"><i id="pg"></i></div><div id="sb"></div></div>`;
  const sx = $('#sx', m);
  sx.onclick = () => {
    if (!feedback && !sx.dataset.arm){ sx.dataset.arm = '1'; sx.textContent = '確定交卷？'; setTimeout(() => { if (sx.isConnected){ delete sx.dataset.arm; sx.textContent = '結束'; } }, 3000); return; }
    finish();
  };
  if (opt.timed){
    const tick = () => {
      const ms = endAt - Date.now(); const tm = $('#tm', m);
      if (!tm){ clearInterval(timerId); return; }
      if (ms <= 0){ clearInterval(timerId); toast('時間到，自動交卷'); finish(); return; }
      const s = Math.ceil(ms / 1000); tm.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      tm.classList.toggle('low', s <= 60);
    };
    tick(); timerId = setInterval(tick, 1000);
  }
  const before = i => groups.slice(0, i).reduce((n, g) => n + g.qs.length, 0);
  function record(q, i, g){
    const ok = i === q.a;
    logAnswer(q.sec, ok);
    if (q.sec !== 'V') bumpStats(q.key, ok);
    S.seen[q.key] = (S.seen[q.key] || 0) + 1;
    if (q.sec !== 'V'){ if (!ok) addMistake(q); else if (opt.fromMistakes) removeMistake(q.key); }
    opt.onAnswer && opt.onAnswer(q, i, ok);
    save();
  }
  function render(){
    stopSpeak();
    const g = groups[gi], base = before(gi);
    $('#sc', m).textContent = `第 ${base + 1}${g.qs.length > 1 ? '–' + (base + g.qs.length) : ''} 題・共 ${totalQ} 題`;
    $('#pg', m).style.width = (base / totalQ * 100) + '%';
    const sb = $('#sb', m); sb.innerHTML = '';
    const wrap = document.createElement('div'); wrap.className = 'grp' + (g.passageHtml ? ' split' : '');
    wrap.innerHTML = `<div class="grp-label">${esc(g.label || '')}</div>`;
    let aud = null;
    if (g.imageHtml){ const f = document.createElement('figure'); f.className = 'photo'; f.innerHTML = g.imageHtml; wrap.appendChild(f); }
    if (g.audio){ aud = audioBlock(g); wrap.appendChild(aud); }
    if (g.passageHtml){ const p = document.createElement('article'); p.className = 'passage'; p.innerHTML = g.passageHtml; wrap.appendChild(p); }
    const qs = document.createElement('div'); qs.className = 'qs';
    const cards = g.qs.map((q, qi) => {
      const el = qCard(q, base + qi + 1); const ch = picks[gi][qi];
      if (ch != null){ if (feedback) revealCard(el, q, ch, g); else $$('.opt', el)[ch].classList.add('sel'); }
      $$('.opt', el).forEach(b => b.onclick = () => choose(qi, +b.dataset.i));
      qs.appendChild(el); return el;
    });
    function choose(qi, i){
      const q = g.qs[qi], el = cards[qi];
      if (feedback){ if (picks[gi][qi] != null) return; picks[gi][qi] = i; record(q, i, g); revealCard(el, q, i, g); }
      else { picks[gi][qi] = i; $$('.opt', el).forEach((b, k) => b.classList.toggle('sel', k === i)); }
      update();
    }
    wrap.appendChild(qs);
    const nav = document.createElement('div'); nav.className = 'sess-nav';
    const last = gi === groups.length - 1;
    nav.innerHTML = `${!feedback && gi > 0 ? '<button class="btn ghost" id="pv">← 上一題</button>' : ''}<button class="btn primary" id="nx">${last ? (feedback ? '看結果' : '交卷') : '下一題 →'}</button>`;
    wrap.appendChild(nav); sb.appendChild(wrap);
    const nx = $('#nx', m), pv = $('#pv', m);
    nx.onclick = () => { if (last) finish(); else { gi++; render(); window.scrollTo(0, 0); } };
    if (pv) pv.onclick = () => { gi--; render(); };
    function update(){
      const all = picks[gi].every(x => x != null);
      nx.disabled = feedback && !all;
      if (aud && feedback && all){ const tr = $('.trans', aud); if (tr) tr.hidden = false; }
    }
    update();
    keyHandler = e => {
      const k = e.key.toUpperCase(); const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'ABCD'.indexOf(k);
      if (idx >= 0 && k.length === 1){ const qi = picks[gi].findIndex(x => x == null); const target = qi >= 0 ? qi : (feedback ? -1 : g.qs.length - 1); if (target >= 0 && idx < g.qs[target].opts.length) choose(target, idx); }
      else if (e.key === 'Enter' && !nx.disabled){ e.preventDefault(); nx.click(); }
      else if (e.key === ' ' && aud){ e.preventDefault(); aud._play(); }
    };
    if (aud && hasTTS && opt.autoplay !== false) setTimeout(() => { if (aud.isConnected) aud._play(); }, 300);
  }
  function finish(){
    if (ended) return; ended = true;
    clearInterval(timerId); stopSpeak(); keyHandler = null; inSession = false;
    if (!feedback){ groups.forEach((g, a) => g.qs.forEach((q, b) => record(q, picks[a][b], g))); }
    const res = {L:[0, 0], R:[0, 0], V:[0, 0]}; const wrong = [];
    groups.forEach((g, a) => g.qs.forEach((q, b) => {
      const i = picks[a][b]; if (i == null && feedback) return;
      const ok = i === q.a; res[q.sec][1]++; if (ok) res[q.sec][0]++; else wrong.push({q, i, g});
    }));
    const extra = opt.onFinish ? opt.onFinish(res) : '';
    const c = res.L[0] + res.R[0] + res.V[0], n = res.L[1] + res.R[1] + res.V[1];
    m.innerHTML = `<div class="stack"><div class="panel stack">
      <span class="eyebrow">${esc(opt.title || '練習')}・結果</span>
      <div class="row" style="align-items:baseline;gap:16px"><div class="sum-big">${c}<span class="muted" style="font-size:20px"> / ${n}</span></div><span class="muted">答對率 ${n ? Math.round(c / n * 100) : 0}%</span></div>
      ${res.L[1] && res.R[1] ? `<p class="muted">聽力 ${res.L[0]}/${res.L[1]}・閱讀 ${res.R[0]}/${res.R[1]}</p>` : ''}
      ${extra || ''}
      <div class="row">${opt.again ? '<button class="btn primary" id="ag">再練一組</button>' : ''}${opt.back ? `<button class="btn" id="bk">${esc(opt.backLabel || '返回')}</button>` : ''}<button class="btn ghost" id="hm">回今日</button></div>
    </div>
    ${wrong.length ? `<div class="panel"><div class="panel-h"><h3>錯題檢討</h3><span class="muted" style="font-size:13px">${opt.title === '單字測驗' ? '答錯的字已放回今天的複習' : '已自動加入錯題本'}</span></div><div class="wrong-list" id="wl"></div></div>` : ''}</div>`;
    const wl = $('#wl', m);
    wrong.forEach(({q, i, g}) => {
      const el = document.createElement('div'); el.className = 'wrong-item';
      el.innerHTML = `<div class="grp-label">${esc(g.label || '')}</div>${g.imageHtml ? `<figure class="photo">${g.imageHtml}</figure>` : ''}
        <div class="q-text" style="margin-top:4px">${q.hideOpts ? esc(q.stemText) : (q.stemHtml || esc(q.stem))}</div>
        <div class="ans">你的答案：<span class="bad">${i == null ? '未作答' : '(' + L[i] + ') ' + esc(q.opts[i])}</span>　正解：<span class="ok">(${L[q.a]}) ${esc(q.opts[q.a])}</span></div>
        <div class="exp"><p>${esc(q.exp)}</p>${g.transcriptHtml ? `<details class="trans" style="margin-top:8px"><summary>文字稿</summary>${g.transcriptHtml}</details>` : ''}
        <div class="ai-row ai-only"><button class="btn ai sm" data-ask>問 AI 老師</button></div><div class="ai-out" hidden></div></div>`;
      $('[data-ask]', el).onclick = e => askTeacher(q, i, g, $('.ai-out', el), e.currentTarget);
      wl.appendChild(el);
    });
    if (opt.again) $('#ag', m).onclick = opt.again;
    if (opt.back) $('#bk', m).onclick = opt.back;
    $('#hm', m).onclick = () => go('today');
    renderNav(); window.scrollTo(0, 0);
  }
  render();
}

function startP5(m, f){

  runSession(m, pickUnseen(keys, 10).map(k => p5Group(+k.split(':')[1])), {title:'Part 5 句子填空' + (f !== 'all' ? '・' + TAGS[f] : ''), again:() => startP5(m, f), back:() => go('read'), backLabel:'回閱讀頁'});
}
async function genQuestions(m){
  const st = $('#aiSt', m), btn = $('#aiGo', m);
  btn.disabled = true; st.textContent = 'AI 出題中，約需 10–40 秒…';
  const focus = aiTopic === 'mix' ? 'a mix of the most common TOEIC Part 5 points (word forms, verb tense, prepositions, conjunctions, vocabulary)' : `the grammar point "${TAGS[aiTopic]}" (${aiTopic})`;
  const prompt = `Create 5 original TOEIC Part 5 (Incomplete Sentences) questions for a Taiwanese learner aiming for TOEIC 600 (CEFR A2-B1).
Focus: ${focus}.
Rules: workplace or business contexts; each sentence 12-25 words containing exactly one blank written as "-------"; exactly 4 options; exactly one correct answer; plausible distractors (for word-form questions use the same word family); vary the position of the correct answer.
Reply with only a JSON array of 5 objects: {"stem": string, "opts": [string, string, string, string], "a": index 0-3 of the correct option, "exp": "繁體中文（台灣）解析，40-80 字，說明為何正確與判斷線索"}`;
  try {
    const arr = await AI.json(prompt, {cache:false});
    const ok = (Array.isArray(arr) ? arr : []).filter(x => x && typeof x.stem === 'string' && x.stem.includes('-------') && Array.isArray(x.opts) && x.opts.length === 4 && x.opts.every(o => typeof o === 'string') && Number.isInteger(x.a) && x.a >= 0 && x.a < 4 && typeof x.exp === 'string');
    if (!ok.length){ st.textContent = 'AI 給的題目格式不完整，請再按一次。'; btn.disabled = false; return; }
    const stamp = Date.now().toString(36);
    aiLast = ok.map((x, i) => ({key:`ai:${stamp}:${i}`, stem:x.stem, opts:x.opts, a:x.a, exp:x.exp}));
    runAiSet(m, aiLast);
  } catch(e){ st.textContent = aiErrMsg(e) || '已取消'; btn.disabled = false; }
}
function runAiSet(m, set){
  const groups = set.map(x => groupForKey(x.key, x));
  runSession(m, groups, {title:'AI 出題・' + (aiTopic === 'mix' ? '綜合' : TAGS[aiTopic]), again:() => { readTab = 'ai'; go('read', mm => genQuestions(mm)); }, back:() => { readTab = 'ai'; go('read'); }, backLabel:'回 AI 出題'});
}

function startMock(m, kind){
  const full = kind === 'full';
  const pick = (arr, test, k) => shuffle(arr.map((x, i) => test(x) ? i : -1).filter(i => i >= 0)).slice(0, k);
  const n = full ? {p1:3, p2:14, conv:6, talk:5, p5:15, p6:2, p7:3, multi:4} : {p1:2, p2:2, conv:1, talk:1, p5:7, p6:0, p7:0, multi:0};
  const groups = [
    ...pick(P1, () => true, n.p1).map(i => p1Group(i)),
    ...pick(P2, () => true, n.p2).map(i => p2Group(i)),
    ...pick(LC, x => x.type === 'conv', n.conv).map(i => lcGroup(i)),
    ...pick(LC, x => x.type === 'talk', n.talk).map(i => lcGroup(i)),
    ...pick(P5, () => true, n.p5).map(i => p5Group(i)),
    ...pick(RC, x => /6/.test(x.type), n.p6).map(i => rcGroup(i)),
    ...pick(RC, x => !/6/.test(x.type) && x.qs.length === 3, n.p7).map(i => rcGroup(i)),
    ...pick(RC, x => x.qs.length === 5, n.multi).map(i => rcGroup(i))
  ];
  if (!full) groups.push(rcGroup(pick(RC, x => x.qs.length === 3, 1)[0]));
  runSession(m, groups, {title: full ? '半版模擬測驗' : '迷你模擬測驗', feedback:false, timed: full ? 60 : 15, autoplay:true,
    onFinish: res => {
      const lp = res.L[1] ? res.L[0] / res.L[1] : 0, rp = res.R[1] ? res.R[0] / res.R[1] : 0;
      const Ls = secScore(lp, 0.95), Rs = secScore(rp, 1.05), est = Ls + Rs;
      S.mocks.push({d:today(), kind: full ? 'full' : 'mini', l:res.L, r:res.R, L:Ls, R:Rs, est}); if (S.mocks.length > 30) S.mocks.shift(); save();
      return `<div class="score-split"><div><b>${est}</b><span>預估總分</span></div><div><b>${Ls}</b><span>聽力</span></div><div><b>${Rs}</b><span>閱讀</span></div></div>${scaleBar(est, S.settings.target)}`;
    }, back:() => go('mock'), backLabel:'回測驗頁'});
}

}

  try {
    const r = await AI.json(prompt, {cache:false});
    const score = Math.max(1, Math.min(5, parseInt(r.score, 10) || 3));
    const fixes = Array.isArray(r.fixes) ? r.fixes.filter(f => f && f.orig && f.fix) : [];
    const phrases = Array.isArray(r.phrases) ? r.phrases.filter(p => p && p.en) : [];
    out.innerHTML = `<div class="stack" style="border-top:1px solid var(--line);padding-top:16px">
      <div class="row"><span class="score-dots" aria-label="${score} / 5">${[1,2,3,4,5].map(i => `<i class="${i <= score ? 'f' : ''}"></i>`).join('')}</span><b class="num">${score} / 5</b></div>
      <p>${esc(r.summary || '')}</p>
      ${fixes.length ? `<div><h3 style="font-size:15px;margin-bottom:4px">修改建議</h3>${fixes.map(f => `<div class="fix"><del>${esc(f.orig)}</del><ins>→ ${esc(f.fix)}</ins><small>${esc(f.why || '')}</small></div>`).join('')}</div>` : '<p class="muted">沒有明顯的錯誤，很棒！</p>'}
      ${r.improved ? `<div><div class="row" style="justify-content:space-between"><h3 style="font-size:15px">參考改寫</h3><button class="speak" id="sayImp" aria-label="朗讀改寫">${SPEAK_SVG}</button></div><div class="task-box" style="margin-top:6px;white-space:pre-wrap">${esc(r.improved)}</div></div>` : ''}
      ${phrases.length ? `<div><h3 style="font-size:15px;margin-bottom:6px">好用片語</h3><ul class="tips">${phrases.map(p => `<li><span style="font-family:var(--f-read);font-weight:600">${esc(p.en)}</span>　${esc(p.zh || '')}</li>`).join('')}</ul></div>` : ''}
    </div>`;
    const si = $('#sayImp', out); if (si) si.onclick = () => speak(String(r.improved));
    const d = day(); d.ai = (d.ai || 0) + 1; save();
  } catch(e){ out.innerHTML = `<p class="muted">${esc(aiErrMsg(e))}</p>`; }
  btn.disabled = false;
}
function rpRules(rp){
  return `Let's do an English role-play for TOEIC practice. You are ${rp.ai}. I am ${rp.me}. Situation: ${rp.situation}
Rules for every reply:
- Stay in character. Use simple, natural business English for a TOEIC 600 learner (CEFR A2-B1): 1-3 short sentences, usually ending with a question to keep the conversation going.
- After your in-character reply, add a new line that starts with "提示：". If my last message had grammar or word-choice mistakes, give one short correction in Traditional Chinese (Taiwan) and show the corrected English. If it had no mistakes, write "提示：很好！" and one useful alternative phrase.
- Your very first message only opens the conversation in character, with no 提示 line.`;
}
function renderTalk(el){
  const rp = ROLEPLAYS.find(r => r.id === rpId) || ROLEPLAYS[0];
  el.innerHTML = `<div class="stack">
    <div class="scen">${ROLEPLAYS.map(r => `<button class="${r.id === rp.id ? 'on' : ''}" data-rp="${r.id}"><b>${esc(r.title)}</b><span>${esc(r.situation.split('.')[0])}.</span></button>`).join('')}</div>
    <div class="panel stack">
      <div class="row" style="justify-content:space-between"><div><span class="eyebrow">角色對話</span><h3 style="margin-top:4px">${esc(rp.title)}</h3></div><button class="btn sm ai-only" id="rpStart">${chat && chat.id === rp.id ? '重新開始' : '開始對話'}</button></div>
      <div class="chat" id="chat"></div>
      <div class="compose ai-only" id="cmp" ${chat && chat.id === rp.id ? '' : 'hidden'}><textarea id="msg" rows="2" placeholder="用英文回覆…（Enter 送出，Shift+Enter 換行）"></textarea><button class="btn primary" id="send">送出</button></div>
    </div></div>`;
  $$('[data-rp]', el).forEach(b => b.onclick = () => { rpId = b.dataset.rp; renderTalk(el); });
  $('#rpStart', el).onclick = () => { chat = {id:rp.id, turns:[{role:'user', content:rpRules(rp) + '\n\nPlease start the conversation now.'}], view:[]}; renderTalk(el); sendChat(el, null); };
  const box = $('#msg', el);
  if (box){
    box.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); $('#send', el).click(); } };
    $('#send', el).onclick = () => { const v = box.value.trim(); if (!v) return; box.value = ''; sendChat(el, v); };
  }
  drawChat(el);
}
function splitTip(t){ const i = t.indexOf('提示：'); return i >= 0 ? [t.slice(0, i).trim(), t.slice(i).trim()] : [t.trim(), '']; }
function drawChat(el){
  const c = $('#chat', el); if (!c) return;
  if (!chat || chat.id !== rpId){ c.innerHTML = '<p class="muted" style="font-size:14px">按「開始對話」，AI 會先用英文開場，你用英文回覆。每次回覆後會有一行中文提示幫你修正。</p>'; return; }
  c.innerHTML = chat.view.map((v, i) => {
    if (v.role === 'me') return `<div class="msg me">${esc(v.text)}</div>`;
    const [en, tip] = splitTip(v.text);
    return `<div class="msg ai">${md(en)}${en ? `<div class="row"><button class="speak" data-say="${i}" aria-label="朗讀">${SPEAK_SVG}</button></div>` : ''}${tip ? `<span class="tip">${md(tip)}</span>` : ''}</div>`;
  }).join('');
  $$('[data-say]', c).forEach(b => b.onclick = () => speak(splitTip(chat.view[+b.dataset.say].text)[0].replace(/\*\*/g, ''), 'B'));
  c.scrollTop = c.scrollHeight;
}
async function sendChat(el, text){
  if (!AI || !chat) return;
  const send = $('#send', el);
  if (text){ chat.turns.push({role:'user', content:text}); chat.view.push({role:'me', text}); }
  const slot = {role:'ai', text:'…'}; chat.view.push(slot); drawChat(el);
  if (send) send.disabled = true;
  const head = chat.turns[0]; const rest = chat.turns.slice(1).slice(-16);
  try {
    const r = await AI([head, ...rest], {modelTier:'quick', cache:false, onText:({text:t}) => { slot.text = t; drawChat(el); }});
    slot.text = r.text; chat.turns.push({role:'assistant', content:r.text}); drawChat(el);
    speak(splitTip(r.text)[0].replace(/\*\*/g, ''), 'B');
    if (text){ const d = day(); d.ai = (d.ai || 0) + 1; save(); }
    const cmp = $('#cmp', el); if (cmp) cmp.hidden = false;
    const st = $('#rpStart', el); if (st) st.textContent = '重新開始';
  } catch(e){ slot.text = (e && e.text ? e.text + '\n' : '') + '（' + (aiErrMsg(e) || '已取消') + '）'; drawChat(el); }
  if (send) send.disabled = false;
  const box = $('#msg', el); if (box) box.focus();
}

/* ============ 設定 ============ */
function viewSettings(m){
  const st = S.settings;
  const opts = sel => voices.length ? `<option value="">自動選擇</option>` + voices.map(v => `<option value="${esc(v.name)}" ${v.name === sel ? 'selected' : ''}>${esc(v.name)}（${esc(v.lang)}）</option>`).join('') : '<option value="">找不到英文語音</option>';
  m.innerHTML = `<div class="stack">
  <div class="view-h"><div><h2>設定</h2><p>目標、考試日期和語音。進度會自動存檔${syncState === 'ok' ? '並同步到你的 Claude 帳號，換裝置打開也看得到' : '在這個瀏覽器'}。</p></div></div>
  <div class="grid2">
    <form class="panel stack" id="sf">
      <h3>學習目標</h3>
      <label class="stack" style="gap:4px"><span class="muted" style="font-size:13px">目標分數</span><input type="number" id="sTarget" min="300" max="990" step="5" value="${st.target}"></label>
      <label class="stack" style="gap:4px"><span class="muted" style="font-size:13px">考試日期</span><input type="date" id="sExam" value="${esc(st.examDate)}"></label>
      <label class="stack" style="gap:4px"><span class="muted" style="font-size:13px">計畫起始日（決定目前在 12 週計畫的第幾週）</span><input type="date" id="sStart" value="${esc(st.startDate)}"></label>
      <label class="stack" style="gap:4px"><span class="muted" style="font-size:13px">每天新單字數</span><input type="number" id="sNew" min="3" max="40" value="${st.newPerDay}"></label>
      <div><button class="btn primary">儲存</button></div>
    </form>
    <div class="panel stack">
      <h3>語音</h3>
      ${hasTTS ? '' : '<p class="muted">這個瀏覽器不支援語音朗讀，聽力題會改成顯示文字稿。</p>'}
      <label class="stack" style="gap:4px"><span class="muted" style="font-size:13px">語速 <b class="num" id="rv">×${st.rate}</b></span><input type="range" id="sRate" min="0.6" max="1.2" step="0.05" value="${st.rate}"></label>
      <label class="stack" style="gap:4px"><span class="muted" style="font-size:13px">聲音 A（女聲 / 旁白）</span><select id="sVA">${opts(st.voiceA)}</select></label>
      <label class="stack" style="gap:4px"><span class="muted" style="font-size:13px">聲音 B（男聲 / 回應者）</span><select id="sVB">${opts(st.voiceB)}</select></label>
      <div class="row"><button class="btn sm" id="tA" type="button">試聽 A</button><button class="btn sm" id="tB" type="button">試聽 B</button></div>
      <p class="muted" style="font-size:12.5px">可選的聲音由你的作業系統和瀏覽器決定。想練英國、澳洲口音，可以選 en-GB、en-AU 的聲音。</p>
    </div>
  </div>
  ${STANDALONE ? `<div class="panel stack"><h3>安裝到手機或電腦</h3>
    <p class="muted" style="font-size:14px">安裝後會像一般 App 一樣出現在主畫面，第一次開啟後就能離線使用。</p>
    <ul class="tips">
      <li><b>iPhone（Safari）</b>：點下方的「分享」→「加入主畫面」。</li>
      <li><b>Android（Chrome）</b>：右上角選單 →「安裝應用程式」或「加到主畫面」。</li>
      <li><b>電腦（Chrome / Edge）</b>：網址列右側的安裝圖示 →「安裝」。</li>
      <li><b>更自然的語音</b>：iPhone 到「設定 → 輔助使用 → 朗讀內容 → 聲音 → 英文」下載高品質語音；Android 到「設定 → 文字轉語音」安裝 Google 語音。</li>
    </ul>
  </div>
  ` : ''}<div class="panel stack" ${STANDALONE ? 'hidden' : ''}><h3>在手機上使用</h3>
    <p class="muted" style="font-size:14px">這個頁面可以直接用手機瀏覽器打開，登入同一個 Claude 帳號，進度就會同步。加到主畫面後，點圖示就能直接進來。</p>
    <ul class="tips">
      <li><b>iPhone（Safari）</b>：打開這個頁面 → 點下方的「分享」→「加入主畫面」。</li>
      <li><b>Android（Chrome）</b>：打開這個頁面 → 右上角選單 →「加到主畫面」。</li>
      <li><b>更自然的語音</b>：iPhone 可到「設定 → 輔助使用 → 朗讀內容 → 聲音 → 英文」下載高品質語音；Android 到「設定 → 文字轉語音」安裝 Google 語音。下載後回到上面的「語音」選擇。</li>
      <li>需要網路連線，離線時無法使用。</li>
    </ul>
  </div>
  <div class="panel stack"><h3>備份與轉移</h3>
    <p class="muted" style="font-size:14px">把進度複製成一段備份碼，貼到另一個版本（Claude 版或離線版）或另一台裝置就能還原。${STANDALONE ? '離線版的資料只存在這台裝置，清除瀏覽器資料就會消失，建議每週備份一次。' : ''}</p>
    <div class="row"><button class="btn" id="bkCopy" type="button">複製備份碼</button>${STANDALONE ? '<button class="btn" id="bkFile" type="button">下載備份檔</button><label class="btn" for="bkPick">從檔案還原</label><input type="file" id="bkPick" accept="application/json,.json" hidden>' : ''}</div>
    <label for="bkText" class="muted" style="font-size:13px">還原：把備份碼貼在下面</label>
    <textarea id="bkText" rows="3" placeholder="{&quot;v&quot;:1, ...}"></textarea>
    <div class="confirm-row"><button class="btn" id="bkRestore" type="button">還原</button><span class="muted" id="bkMsg" style="font-size:13px"></span></div>
  </div>
  <div class="panel stack"><h3>資料</h3>
    <p class="muted" style="font-size:14px">已學 ${learnedCount()} 字・錯題 ${S.mistakes.length} 題・模擬測驗 ${S.mocks.length} 次・學習天數 ${Object.keys(S.log).filter(k => activity(S.log[k])).length} 天</p>
    <div class="confirm-row"><button class="btn danger" id="rst" type="button">清除所有進度</button><span class="muted" id="rstMsg" style="font-size:13px"></span></div>
  </div></div>`;
  $('#sf', m).onsubmit = e => {
    e.preventDefault();
    st.target = Math.max(300, Math.min(990, round5(+$('#sTarget', m).value || 600)));
    st.examDate = $('#sExam', m).value; st.startDate = $('#sStart', m).value || today();
    st.newPerDay = Math.max(3, Math.min(40, parseInt($('#sNew', m).value, 10) || 10));
    save(); toast('已儲存');
  };
  $('#sRate', m).oninput = e => { st.rate = +e.target.value; $('#rv', m).textContent = '×' + st.rate; };
  $('#sRate', m).onchange = () => save();
  $('#sVA', m).onchange = e => { st.voiceA = e.target.value; save(); };
  $('#sVB', m).onchange = e => { st.voiceB = e.target.value; save(); };
  $('#tA', m).onclick = () => speak('Good morning. The meeting has been moved to conference room B.', 'A');
  $('#tB', m).onclick = () => speak('Thanks for letting me know. I will be there at ten.', 'B');
  bindBackup(m);
  const rst = $('#rst', m);
  rst.onclick = () => {
    if (!rst.dataset.arm){ rst.dataset.arm = '1'; rst.textContent = '再按一次確認清除'; $('#rstMsg', m).textContent = '單字進度、錯題、紀錄都會刪除，無法復原。'; setTimeout(() => { if (rst.isConnected){ delete rst.dataset.arm; rst.textContent = '清除所有進度'; $('#rstMsg', m).textContent = ''; } }, 4000); return; }
    S = freshState(); save(); renderNav(); toast('已清除所有進度'); go('today');
  };
}

function parseBackup(text){
  try { const o = JSON.parse(text); if (o && typeof o === 'object' && o.srs && o.log && o.settings) return o; } catch(e){}
  return null;
}
function bindBackup(m){
  const ta = $('#bkText', m), msg = $('#bkMsg', m), rb = $('#bkRestore', m);
  let pending = null;
  $('#bkCopy', m).onclick = () => {
    const txt = JSON.stringify(S);
    const fallback = () => { ta.value = txt; ta.focus(); ta.select(); msg.textContent = '無法自動複製，備份碼已放進下方欄位，請手動全選複製。'; };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = `已複製備份碼（約 ${Math.max(1, Math.round(txt.length / 1024))} KB）。`; }, fallback); }
    catch(e){ fallback(); }
  };
  const arm = o => {
    pending = o; rb.textContent = '確認還原'; rb.classList.add('primary');
    msg.textContent = `備份內容：已學 ${Object.keys(o.srs).length} 字、學習紀錄 ${Object.keys(o.log).length} 天、錯題 ${(o.mistakes || []).length} 題。還原會取代目前的進度。`;
  };
  ta.oninput = () => { pending = null; rb.textContent = '還原'; rb.classList.remove('primary'); msg.textContent = ''; };
  rb.onclick = () => {
    if (pending){ S = mergeState(JSON.parse(JSON.stringify(pending))); pending = null; save(); renderNav(); toast('已還原備份'); go('today'); return; }
    const o = parseBackup(ta.value.trim());
    if (!o){ msg.textContent = '看不懂這段備份碼，請確認從頭到尾完整貼上。'; return; }
    arm(o);
  };
  const fb = $('#bkFile', m);
  if (fb) fb.onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'}));
    a.download = 'toeic600-backup-' + today() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  const pk = $('#bkPick', m);
  if (pk) pk.onchange = () => {
    const f = pk.files && pk.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { const o = parseBackup(String(r.result)); if (o) arm(o); else msg.textContent = '這個檔案不是有效的備份檔。'; };
    r.readAsText(f);
  };
}

/* ============ 啟動 ============ */
route();
initCloud();
initAI();
</script>

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
